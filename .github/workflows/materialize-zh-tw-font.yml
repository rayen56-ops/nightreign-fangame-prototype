name: Materialize zh-TW HUD Font

on:
  push:
    branches: [m2-7-web-cjk-font]
    paths:
      - art/build_zh_tw_font_subset.py
      - src/nightreign/ui/night_ui_text.gd
      - src/nightreign/expedition/night_overlay.gd
      - .github/workflows/materialize-zh-tw-font.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonttools
        run: python3 -m pip install --disable-pip-version-check fonttools==4.63.0

      - name: Download pinned Noto Sans TC source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o /tmp/NotoSansTC-VF.ttf             https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/Variable/TTF/Subset/NotoSansTC-VF.ttf
          test -s /tmp/NotoSansTC-VF.ttf

      - name: Build compact Traditional Chinese HUD font
        shell: bash
        run: |
          set -euo pipefail
          python3 art/build_zh_tw_font_subset.py             --source /tmp/NotoSansTC-VF.ttf             --output assets/fonts/nightreign_ui_tc/NightreignUITC-Regular.ttf             --text-source src/nightreign/ui/night_ui_text.gd             --text-source src/nightreign/expedition/night_overlay.gd
          test -s assets/fonts/nightreign_ui_tc/NightreignUITC-Regular.ttf
          size=$(stat -c%s assets/fonts/nightreign_ui_tc/NightreignUITC-Regular.ttf)
          test "$size" -lt 250000
          echo "Subset size: $size bytes"

      - name: Commit materialized font
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/nightreign_ui_tc/NightreignUITC-Regular.ttf
          if git diff --cached --quiet; then
            echo "Font is already up to date."
            exit 0
          fi
          git commit -m "M2.7: materialize bundled zh-TW HUD font"
          git push
