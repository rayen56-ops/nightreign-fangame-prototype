name: M2 Enemy Visual QA

on:
  push:
    branches: [main]
    paths:
      - scenes/actor/actor.gd
      - src/nightreign/enemies/night_enemy_visual.gd
      - src/nightreign/enemies/night_enemy_visual_profile.gd
      - tests/night_enemy_visual.gd
      - tests/night_enemy_visual.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m2-enemy-visual-qa.yml
  pull_request:
    branches: [main]
    paths:
      - scenes/actor/actor.gd
      - src/nightreign/enemies/night_enemy_visual.gd
      - src/nightreign/enemies/night_enemy_visual_profile.gd
      - tests/night_enemy_visual.gd
      - tests/night_enemy_visual.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m2-enemy-visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enemy-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/m2-enemy-visual-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-enemy-visual-import.log

      - name: Run enemy silhouette contract
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_ENEMY_VISUAL_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_enemy_visual.tscn --quit-after 1800 2>&1 | tee /tmp/m2-enemy-visual.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-enemy-visual.log
          test -s docs/M2_ENEMY_VISUAL_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M2_ENEMY_VISUAL_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks',0) >= 40, r.get('checks')
          assert r.get('enemy_ids') == ['soldier','wolf','skeleton'], r.get('enemy_ids')
          assert r.get('boss_deferred') == ['gladius','gladius_echo'], r.get('boss_deferred')
          print('M2 Enemy Visual QA:', r['checks'], 'checks passed')
          PY

      - name: Run expedition regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M1_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/expedition.tscn --quit-after 1800 2>&1 | tee /tmp/m2-enemy-visual-expedition.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-enemy-visual-expedition.log
          test -s docs/M1_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M1_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          print('M2 Enemy Visual expedition regression:', r.get('checks',0), 'checks passed')
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-enemy-visual-qa
          path: |
            docs/M2_ENEMY_VISUAL_QA.json
            docs/M1_QA.json
            /tmp/m2-enemy-visual-import.log
            /tmp/m2-enemy-visual.log
            /tmp/m2-enemy-visual-expedition.log
          if-no-files-found: ignore
