name: M2 Web Font QA

on:
  push:
    branches: [main]
    paths:
      - assets/fonts/nightreign_ui_tc/**
      - src/nightreign/ui/night_ui_font.gd
      - src/nightreign/ui/night_ui_text.gd
      - src/nightreign/expedition/night_overlay.gd
      - tests/night_ui_font.gd
      - tests/night_ui_font.tscn
      - tests/night_overlay.gd
      - tests/night_overlay.tscn
      - export_presets.cfg
      - .github/workflows/m2-web-font-qa.yml
  pull_request:
    branches: [main]
    paths:
      - assets/fonts/nightreign_ui_tc/**
      - src/nightreign/ui/night_ui_font.gd
      - src/nightreign/ui/night_ui_text.gd
      - src/nightreign/expedition/night_overlay.gd
      - tests/night_ui_font.gd
      - tests/night_ui_font.tscn
      - tests/night_overlay.gd
      - tests/night_overlay.tscn
      - export_presets.cfg
      - .github/workflows/m2-web-font-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-font:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard bundled font size and license
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/fonts/nightreign_ui_tc/NightreignUITC-Regular.ttf
          test -s assets/fonts/nightreign_ui_tc/OFL.txt
          size=$(stat -c%s assets/fonts/nightreign_ui_tc/NightreignUITC-Regular.ttf)
          test "$size" -gt 10000
          test "$size" -lt 250000
          echo "Bundled zh-TW font: $size bytes"

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/m2-web-font-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-web-font-import.log

      - name: Run Traditional Chinese font coverage contract
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_WEB_FONT_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_ui_font.tscn --quit-after 1800 2>&1 | tee /tmp/m2-web-font.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-web-font.log
          test -s docs/M2_WEB_FONT_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M2_WEB_FONT_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks',0) >= 37, r.get('checks')
          print('M2 Web Font QA:', r['checks'], 'checks passed')
          PY

      - name: Run localized HUD regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_HUD_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_overlay.tscn --quit-after 1800 2>&1 | tee /tmp/m2-web-font-hud.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-web-font-hud.log
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M2_HUD_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks',0) >= 55, r.get('checks')
          print('M2 Web Font HUD regression:', r['checks'], 'checks passed')
          PY

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$target"
          cp -R /tmp/godot-templates/templates/. "$target/"
          test -f "$target/web_release.zip"

      - name: Export Web build with bundled font
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/nightreign-web-font
          mkdir -p /tmp/nightreign-web-font
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release "Web" /tmp/nightreign-web-font/index.html 2>&1 | tee /tmp/m2-web-font-export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-web-font-export.log
          test -s /tmp/nightreign-web-font/index.html
          test -n "$(find /tmp/nightreign-web-font -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find /tmp/nightreign-web-font -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-web-font-qa
          path: |
            docs/M2_WEB_FONT_QA.json
            docs/M2_HUD_QA.json
            /tmp/m2-web-font-import.log
            /tmp/m2-web-font.log
            /tmp/m2-web-font-hud.log
            /tmp/m2-web-font-export.log
          if-no-files-found: ignore
