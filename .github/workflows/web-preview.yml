name: Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightreign-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static T0 quality gate
        run: python3 tools/validate_t0.py

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/import.log

      - name: Runtime T0 quality gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/t0_core.tscn --quit-after 1800 2>&1 | tee /tmp/runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/runtime.log
          python3 -c "import json; r=json.load(open('docs/T0_QA.json', encoding='utf-8')); assert r.get('failures') == [], r.get('failures'); assert r.get('checks') == 246, r.get('checks'); print('Native T0 runtime: 246/246')"

      - name: Verify bundled Traditional Chinese HUD font
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_WEB_FONT_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_ui_font.tscn --quit-after 1800 2>&1 | tee /tmp/web-font.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/web-font.log
          test -s docs/M2_WEB_FONT_QA.json
          python3 -c "import json; r=json.load(open('docs/M2_WEB_FONT_QA.json', encoding='utf-8')); assert r.get('failures') == [], r.get('failures'); assert r.get('checks',0) >= 37, r.get('checks'); print('Web zh-TW font:', r['checks'], 'checks passed')"

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$target"
          cp -R /tmp/godot-templates/templates/. "$target/"
          test -f "$target/web_release.zip"

      - name: Export playable Web build
        shell: bash
        run: |
          set -o pipefail
          rm -rf site
          mkdir -p site/game
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release "Web" site/game/index.html 2>&1 | tee /tmp/export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/export.log
          test -s site/game/index.html
          test -n "$(find site/game -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find site/game -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Install browser QA runtimes
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium firefox

      - name: Browser gameplay and UI regression gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/web-qa
          python3 -m http.server 4173 -d site >/tmp/nightreign-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          node tools/web_playability_smoke.mjs
          node tools/ui_regression_smoke.mjs

      - name: Build preview landing page
        shell: bash
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTREIGN GRID</title><style>html,body{height:100%;margin:0;background:#090c10;color:#d8dde3;font-family:system-ui}body{display:grid;place-items:center}.card{padding:32px;border:1px solid #343b45;background:#10151c;text-align:center;max-width:620px}a{display:inline-block;margin-top:16px;padding:12px 18px;border:1px solid #b59a67;color:#eee3cb;text-decoration:none}.ok{color:#9bc6a5}</style></head><body><div class="card"><h1>NIGHTREIGN GRID</h1><p class="ok">Godot runtime, movement, controls guide and game-over recovery verified.</p><p>遊戲內按 <b>?</b> 可再次查看完整操作表。</p><a href="./game/">進入遊戲</a></div></body></html>
          HTML
          touch site/.nojekyll

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-qa-${{ github.sha }}
          path: artifacts/web-qa
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
