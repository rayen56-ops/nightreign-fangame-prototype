name: T1 Combat QA

on:
  push:
    branches: [t1-character-art-pass-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static T0 quality gate
        run: python3 tools/validate_t0.py

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/import.log

      - name: Preserve T0 runtime contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/t0_core.tscn --quit-after 1800 2>&1 | tee /tmp/t0.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/t0.log
          python3 -c "import json; r=json.load(open('docs/T0_QA.json')); assert r['checks']==246 and not r['failures'], r"

      - name: T1 combat runtime contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/t1_combat.tscn --quit-after 600 2>&1 | tee /tmp/t1.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/t1.log
          python3 -c "import json; r=json.load(open('docs/T1_QA.json')); assert not r['failures'], r"
