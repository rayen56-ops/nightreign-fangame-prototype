name: T0 Core QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  t0-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static T0 gate
        run: python3 tools/validate_t0.py

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Import project assets
        run: |
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --editor --import --path . --quit \
            --log-file docs/t0-ci-import.log

      - name: Run 20-floor runtime contract
        run: |
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . res://tests/t0_core.tscn \
            --log-file docs/t0-ci-runtime.log --quit-after 1800
          test -f docs/T0_QA.json
          python3 - <<'PY'
          import json
          report=json.load(open('docs/T0_QA.json',encoding='utf-8'))
          assert report['failures'] == [], report['failures']
          print(f"T0 runtime QA: {report['checks']} checks passed")
          PY
          ! grep -q "SCRIPT ERROR:" docs/t0-ci-runtime.log

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-qa-evidence
          path: |
            docs/T0_QA.json
            docs/T0_STATIC_QA.json
            docs/t0-ci-import.log
            docs/t0-ci-runtime.log
          if-no-files-found: ignore
