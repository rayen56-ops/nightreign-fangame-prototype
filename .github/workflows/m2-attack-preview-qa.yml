name: M2 Attack Preview QA

on:
  push:
    branches: [main]
    paths:
      - src/nightreign/combat/night_attack_preview.gd
      - src/nightreign/expedition/night_overlay.gd
      - assets/nightreign/data/weapon_archetypes.json
      - tests/night_attack_preview.gd
      - tests/night_attack_preview.tscn
      - tests/weapon_archetypes.gd
      - tests/weapon_archetypes.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m2-attack-preview-qa.yml
  pull_request:
    branches: [main]
    paths:
      - src/nightreign/combat/night_attack_preview.gd
      - src/nightreign/expedition/night_overlay.gd
      - assets/nightreign/data/weapon_archetypes.json
      - tests/night_attack_preview.gd
      - tests/night_attack_preview.tscn
      - tests/weapon_archetypes.gd
      - tests/weapon_archetypes.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m2-attack-preview-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/m2-preview-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-preview-import.log

      - name: Run attack preview contract
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_ATTACK_PREVIEW_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_attack_preview.tscn --quit-after 1800 2>&1 | tee /tmp/m2-preview.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-preview.log
          test -s docs/M2_ATTACK_PREVIEW_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/M2_ATTACK_PREVIEW_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          assert report.get('checks', 0) >= 35, report.get('checks')
          assert report.get('patterns') == ['single', 'sweep', 'thrust', 'burst', 'cast'], report.get('patterns')
          assert report.get('turn_safe') is True, report.get('turn_safe')
          print('M2 attack preview QA:', report['checks'], 'checks passed')
          PY

      - name: Run weapon regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/WEAPON_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/weapon_archetypes.tscn --quit-after 1800 2>&1 | tee /tmp/m2-preview-weapon.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-preview-weapon.log
          test -s docs/WEAPON_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/WEAPON_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          assert report.get('checks', 0) >= 145, report.get('checks')
          print('M2 preview weapon regression:', report.get('checks', 0), 'checks passed')
          PY

      - name: Run expedition regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M1_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/expedition.tscn --quit-after 1800 2>&1 | tee /tmp/m2-preview-expedition.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-preview-expedition.log
          test -s docs/M1_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/M1_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          print('M2 preview expedition regression:', report.get('checks', 0), 'checks passed')
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-attack-preview-qa
          path: |
            docs/M2_ATTACK_PREVIEW_QA.json
            docs/WEAPON_QA.json
            docs/M1_QA.json
            /tmp/m2-preview-import.log
            /tmp/m2-preview.log
            /tmp/m2-preview-weapon.log
            /tmp/m2-preview-expedition.log
          if-no-files-found: ignore
