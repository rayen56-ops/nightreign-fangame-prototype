name: Materialize NightreignGrid

on:
  push:
    paths:
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project from pinned upstream and staged overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/direct /tmp/materialized
          rsync -a ./ /tmp/direct/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.import' \
            --exclude='.github-import-placeholder'

          cat .import/overlay-*.b64 | base64 --decode > /tmp/nightreign-overlay.tar.xz
          xz -t /tmp/nightreign-overlay.tar.xz

          git clone --quiet https://github.com/statico/godot-roguelike-example.git /tmp/upstream
          git -C /tmp/upstream checkout --quiet 5fa12fd3206df9ce42284cf7aab6b41b69b7fca6
          rsync -a --exclude='.git' /tmp/upstream/ /tmp/materialized/
          tar -xJf /tmp/nightreign-overlay.tar.xz -C /tmp/materialized
          rsync -a /tmp/direct/ /tmp/materialized/

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/materialized/ ./
          rm -rf .import .github-import-placeholder runtime .godot

      - name: Commit materialized Godot project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nightreign-prototype-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to materialize.'
            exit 0
          fi
          git commit -m '[materialized] Import NightreignGrid base project'
          git push
