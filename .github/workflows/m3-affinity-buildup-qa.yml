name: M3 Affinity Buildup QA

on:
  push:
    branches: [main]
    paths:
      - assets/nightreign/data/expedition.json
      - src/combat.gd
      - src/nightreign/expedition/night_run.gd
      - src/item.gd
      - src/actions/melee_action.gd
      - src/actions/night_spell_action.gd
      - tests/affinity_buildup.gd
      - tests/affinity_buildup.tscn
      - tests/weapon_progression.gd
      - tests/weapon_progression.tscn
      - tests/night_gladius_visual.gd
      - tests/night_gladius_visual.tscn
      - tests/night_hit_feedback.gd
      - tests/night_hit_feedback.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m3-affinity-buildup-qa.yml
  pull_request:
    branches: [main]
    paths:
      - assets/nightreign/data/expedition.json
      - src/combat.gd
      - src/nightreign/expedition/night_run.gd
      - src/item.gd
      - src/actions/melee_action.gd
      - src/actions/night_spell_action.gd
      - tests/affinity_buildup.gd
      - tests/affinity_buildup.tscn
      - tests/weapon_progression.gd
      - tests/weapon_progression.tscn
      - tests/night_gladius_visual.gd
      - tests/night_gladius_visual.tscn
      - tests/night_hit_feedback.gd
      - tests/night_hit_feedback.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m3-affinity-buildup-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affinity-buildup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/m3-affinity-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m3-affinity-import.log

      - name: Run affinity and buildup contract
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M3_AFFINITY_BUILDUP_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/affinity_buildup.tscn --quit-after 1800 2>&1 | tee /tmp/m3-affinity.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m3-affinity.log
          test -s docs/M3_AFFINITY_BUILDUP_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M3_AFFINITY_BUILDUP_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks',0) >= 70, r.get('checks')
          assert r.get('statuses') == ['blood_loss','holy_stagger'], r.get('statuses')
          assert r.get('affinities') == ['physical','magic','holy'], r.get('affinities')
          assert r.get('blood_loss_action_scoped') is True
          assert r.get('holy_stagger_threshold') == 3
          print('M3 Affinity Buildup QA:', r['checks'], 'checks passed')
          PY

      - name: Run M3.1 weapon progression regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M3_WEAPON_PROGRESSION_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/weapon_progression.tscn --quit-after 1800 2>&1 | tee /tmp/m3-affinity-progression.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m3-affinity-progression.log
          test -s docs/M3_WEAPON_PROGRESSION_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M3_WEAPON_PROGRESSION_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks',0) >= 650, r.get('checks')
          print('M3.1 progression regression:', r['checks'], 'checks passed')
          PY

      - name: Run hit-feedback regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_HIT_FEEDBACK_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_hit_feedback.tscn --quit-after 1800 2>&1 | tee /tmp/m3-affinity-hit.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m3-affinity-hit.log
          test -s docs/M2_HIT_FEEDBACK_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M2_HIT_FEEDBACK_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          print('Hit feedback regression:', r.get('checks',0), 'checks passed')
          PY

      - name: Run Gladius visual-state regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_GLADIUS_VISUAL_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_gladius_visual.tscn --quit-after 1800 2>&1 | tee /tmp/m3-affinity-gladius.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m3-affinity-gladius.log
          test -s docs/M2_GLADIUS_VISUAL_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M2_GLADIUS_VISUAL_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks',0) >= 30, r.get('checks')
          print('Gladius visual regression:', r['checks'], 'checks passed')
          PY

      - name: Run full expedition regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M1_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/expedition.tscn --quit-after 1800 2>&1 | tee /tmp/m3-affinity-expedition.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m3-affinity-expedition.log
          test -s docs/M1_QA.json
          python3 - <<'PY'
          import json
          r=json.load(open('docs/M1_QA.json',encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          print('Expedition regression:', r.get('checks',0), 'checks passed')
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-affinity-buildup-qa
          path: |
            docs/M3_AFFINITY_BUILDUP_QA.json
            docs/M3_WEAPON_PROGRESSION_QA.json
            docs/M2_HIT_FEEDBACK_QA.json
            docs/M2_GLADIUS_VISUAL_QA.json
            docs/M1_QA.json
            /tmp/m3-affinity-import.log
            /tmp/m3-affinity.log
            /tmp/m3-affinity-progression.log
            /tmp/m3-affinity-hit.log
            /tmp/m3-affinity-gladius.log
            /tmp/m3-affinity-expedition.log
          if-no-files-found: ignore
