name: T0 Full Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t0-full-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "nightreign-t0-full-repair"
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Restore the ActorAction/BaseAction API accidentally replaced in AttackMoveAction.
          Path('src/actions/attack_move_action.gd').write_text(r'''class_name AttackMoveAction
          extends ActorAction

          var direction: Vector2i


          func _init(p_actor: Monster, dir: Vector2i) -> void:
          \tsuper(p_actor)
          \tdirection = dir


          func _execute(map: Map, result: ActionResult) -> bool:
          \tif not super(map, result):
          \t\treturn false

          \tvar current_pos := map.find_monster_position(actor)
          \tif current_pos == Utils.INVALID_POS:
          \t\tpush_error("AttackMoveAction actor is not present on the current map: %s" % actor)
          \t\treturn false

          \tif actor.has_status_effect(StatusEffect.Type.CONFUSED):
          \t\tdirection = Utils.ALL_DIRECTIONS.pick_random()

          \tif actor.has_status_effect(StatusEffect.Type.PARALYZED):
          \t\tif actor == World.player:
          \t\t\tresult.message = "You are paralyzed!"
          \t\t\tresult.message_level = LogMessages.Level.TERRIBLE
          \t\telse:
          \t\t\tresult.message = "%s tries to move but is paralyzed!" % actor.name
          \t\t\tresult.message_level = LogMessages.Level.BAD
          \t\treturn true

          \tif actor == World.player:
          \t\tNightRun.facing = direction

          \tvar new_pos := current_pos + direction
          \tif not map.is_in_bounds(new_pos):
          \t\treturn false

          \tvar target := map.get_monster(new_pos)
          \tif target and target.has_meta("family"):
          \t\tresult.message = "Your family occupies that tile."
          \t\treturn false

          \tif target:
          \t\tvar melee := MeleeAction.new(actor, direction)
          \t\treturn melee._execute(map, result)

          \tvar move := MoveAction.new(actor, direction)
          \treturn move._execute(map, result)


          func _to_string() -> String:
          \treturn "AttackMoveAction(actor: %s, direction: %s)" % [actor, direction]
          ''', encoding='utf-8')

          # Vector2i.ZERO is a valid tile. INVALID_POS is the only missing-position sentinel.
          move = Path('src/actions/move_action.gd')
          text = move.read_text(encoding='utf-8')
          text = text.replace(
              'var current_pos: Vector2i = map.find_monster_position(actor)\n\tif not current_pos:\n\t\treturn false',
              'var current_pos: Vector2i = map.find_monster_position(actor)\n\tif current_pos == Utils.INVALID_POS:\n\t\tpush_error("MoveAction actor is not present on the current map: %s" % actor)\n\t\treturn false',
              1,
          )
          needle = '\tvar new_pos: Vector2i = current_pos + direction\n\n\t# Check if target position is walkable'
          replacement = '\tvar new_pos: Vector2i = current_pos + direction\n\tif not map.is_in_bounds(new_pos):\n\t\treturn false\n\n\t# Check if target position is walkable'
          if replacement not in text:
              assert needle in text, 'MoveAction layout changed; refusing unsafe patch'
              text = text.replace(needle, replacement, 1)
          move.write_text(text, encoding='utf-8')

          # The procedural contract must guarantee the player can actually leave the spawn tile now,
          # not merely that a graph route exists after opening a closed door.
          world = Path('src/world.gd')
          text = world.read_text(encoding='utf-8')
          if 'func _has_immediate_player_egress(' not in text:
              anchor = '\n\nfunc _has_walkable_route(map: Map, start: Vector2i, goal: Vector2i) -> bool:'
              assert anchor in text, 'world.gd route contract anchor changed'
              helper = '''\n\nfunc _has_immediate_player_egress(map: Map, spawn: Vector2i) -> bool:
\tif spawn == Utils.INVALID_POS:
\t\treturn false
\tfor direction: Vector2i in Utils.ALL_DIRECTIONS:
\t\tvar target := spawn + direction
\t\tif not map.is_in_bounds(target):
\t\t\tcontinue
\t\tvar cell := map.get_cell(target)
\t\tif cell.is_walkable() and map.get_monster(target) == null:
\t\t\treturn true
\treturn false
'''
              text = text.replace(anchor, helper + anchor, 1)
          contract_anchor = '\tif plan.down_destination == "" and down != Utils.INVALID_POS:\n\t\treturn false\n'
          contract_add = contract_anchor + '\tif up != Utils.INVALID_POS and not _has_immediate_player_egress(map, up):\n\t\treturn false\n'
          if '_has_immediate_player_egress(map, up)' not in text:
              assert contract_anchor in text, 'world.gd T0 contract anchor changed'
              text = text.replace(contract_anchor, contract_add, 1)
          world.write_text(text, encoding='utf-8')

          # Add a QA-only Web query hook. Normal players still see the menu; ?qa=1 enters the game.
          menu = Path('scenes/menu/main_menu.gd')
          text = menu.read_text(encoding='utf-8')
          if 'func _ready() -> void:' not in text or 'nightreign_qa_autostart' not in text:
              old = '# Uncomment this to test the game immediately after running\n# func _ready() -> void:\n# \tcall_deferred("_on_play_button_pressed")\n'
              new = '''# Browser QA can enter gameplay without guessing canvas coordinates.\n# A normal Web/desktop launch still shows this menu.\nfunc _ready() -> void:\n\tif OS.has_feature("web"):\n\t\tvar search := String(JavaScriptBridge.eval("window.location.search"))\n\t\tif "qa=1" in search:\n\t\t\tset_meta("nightreign_qa_autostart", true)\n\t\t\tcall_deferred("_on_play_button_pressed")\n'''
              assert old in text, 'main_menu.gd starter block changed'
              text = text.replace(old, new, 1)
          menu.write_text(text, encoding='utf-8')

          # Apply deterministic event-driven input + browser telemetry repair.
          PY
          python3 tools/patch_game_input.py

          python3 - <<'PY'
          from pathlib import Path
          # Make the permanent Web Preview gate use the QA-only menu hook.
          wf = Path('.github/workflows/web-preview.yml')
          text = wf.read_text(encoding='utf-8')
          text = text.replace("http://127.0.0.1:4173/game/'", "http://127.0.0.1:4173/game/?qa=1'", 1)
          wf.write_text(text, encoding='utf-8')
          PY

      - name: Static T0 quality gate
        run: python3 tools/validate_t0.py

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/import.log

      - name: Runtime T0 quality gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/t0_core.tscn --quit-after 1800 2>&1 | tee /tmp/runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/runtime.log
          python3 - <<'PY'
          import json
          r = json.load(open('docs/T0_QA.json', encoding='utf-8'))
          assert r.get('failures') == [], r.get('failures')
          assert r.get('checks') == 246, r.get('checks')
          print('Native T0 runtime: 246/246')
          PY

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$target"
          cp -R /tmp/godot-templates/templates/. "$target/"
          test -f "$target/web_release.zip"

      - name: Export repaired Web build
        shell: bash
        run: |
          set -o pipefail
          rm -rf site && mkdir -p site/game
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release "Web" site/game/index.html 2>&1 | tee /tmp/export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/export.log
          test -s site/game/index.html
          test -n "$(find site/game -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find site/game -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Install real browser runtimes
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium firefox

      - name: Prove actual gameplay in Chromium and Firefox
        shell: bash
        run: |
          mkdir -p artifacts/web-qa
          python3 -m http.server 4173 -d site >/tmp/nightreign-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          cat > /tmp/nightreign-repair-smoke.mjs <<'JS'
          import { chromium, firefox } from 'playwright';

          for (const [name, browserType] of [['chromium', chromium], ['firefox', firefox]]) {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
            const fatals = [];
            const failed = [];
            page.on('console', m => {
              const t = m.text();
              if (m.type() === 'error' && /SCRIPT ERROR|Parse Error|Compile Error|RuntimeError|WebAssembly.*failed|abort\(/i.test(t)) fatals.push(t);
            });
            page.on('pageerror', e => fatals.push(`PAGEERROR: ${e.message}`));
            page.on('requestfailed', r => failed.push(`${r.url()} :: ${r.failure()?.errorText ?? 'unknown'}`));

            await page.goto('http://127.0.0.1:4173/game/?qa=1', { waitUntil: 'domcontentloaded', timeout: 30000 });
            const canvas = page.locator('canvas');
            await canvas.waitFor({ state: 'visible', timeout: 30000 });
            await canvas.click({ position: { x: 100, y: 100 } });
            await page.waitForFunction(() => window.__nightreignQA?.ready === true, null, { timeout: 30000 });

            const box = await canvas.boundingBox();
            const initial = await page.evaluate(() => ({...window.__nightreignQA}));
            console.log(name, 'READY', initial, 'canvas', box);
            if (!box || box.width < 500 || box.height < 280) throw new Error(`${name}: invalid canvas ${JSON.stringify(box)}`);
            if (!initial.player_actor_visible) throw new Error(`${name}: player actor not visible`);
            if (!Array.isArray(initial.walkable) || initial.walkable.length === 0) throw new Error(`${name}: spawn has no legal egress ${JSON.stringify(initial)}`);

            await page.keyboard.press('x');
            await page.waitForFunction(t => window.__nightreignQA?.turn > t, initial.turn, { timeout: 5000 });
            const afterWait = await page.evaluate(() => ({...window.__nightreignQA}));
            if (afterWait.turn !== initial.turn + 1) throw new Error(`${name}: wait did not consume exactly one turn`);

            let moved = false;
            for (const key of afterWait.walkable) {
              const before = await page.evaluate(() => ({...window.__nightreignQA}));
              await page.keyboard.press(key);
              try {
                await page.waitForFunction(s => {
                  const q = window.__nightreignQA;
                  return q && (q.x !== s.x || q.y !== s.y);
                }, before, { timeout: 3000 });
                const after = await page.evaluate(() => ({...window.__nightreignQA}));
                if (after.turn !== before.turn + 1) throw new Error(`${name}: move did not consume exactly one turn`);
                console.log(name, 'MOVE_OK', key, before, after);
                moved = true;
                break;
              } catch (e) {
                console.log(name, 'MOVE_ATTEMPT_FAILED', key, String(e));
              }
            }
            if (!moved) throw new Error(`${name}: no legal movement changed player position`);
            if (fatals.length) throw new Error(`${name}: fatal console errors ${JSON.stringify(fatals)}`);
            if (failed.some(x => /\.wasm|\.pck/i.test(x))) throw new Error(`${name}: WASM/PCK network failure ${JSON.stringify(failed)}`);
            await page.screenshot({ path: `artifacts/web-qa/${name}-playable.png`, fullPage: true });
            await browser.close();
          }
          console.log('T0_FULL_REPAIR_PLAYABLE_PASS');
          JS
          node /tmp/nightreign-repair-smoke.mjs

      - name: Build simple verified landing page
        shell: bash
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTREIGN GRID</title><style>html,body{height:100%;margin:0;background:#090c10;color:#d8dde3;font-family:system-ui}body{display:grid;place-items:center}.card{padding:32px;border:1px solid #343b45;background:#10151c;text-align:center}a{display:inline-block;margin-top:16px;padding:12px 18px;border:1px solid #b59a67;color:#eee3cb;text-decoration:none}</style></head><body><div class="card"><h1>NIGHTREIGN GRID</h1><p>T0 browser gameplay verified in Chromium + Firefox.</p><a href="./game/">進入遊戲</a></div></body></html>
          HTML
          touch site/.nojekyll

      - name: Commit only the proven repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          rm -rf node_modules .godot
          git config user.name "nightreign-prototype-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actions/attack_move_action.gd src/actions/move_action.gd src/world.gd scenes/game/game.gd scenes/menu/main_menu.gd .github/workflows/web-preview.yml docs/T0_QA.json docs/T0_STATIC_QA.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Repair already present.'
          else
            git commit -m "T0: restore action API and prove real browser movement"
            git push origin HEAD:main
          fi

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-full-repair-browser-proof-${{ github.sha }}
          path: artifacts/web-qa
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages build
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: repair-and-prove
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
