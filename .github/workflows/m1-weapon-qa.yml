name: M1 Weapon QA

on:
  push:
    branches: [main]
    paths:
      - src/nightreign/expedition/night_run.gd
      - src/actions/attack_move_action.gd
      - src/actions/melee_action.gd
      - src/actions/player_fire_action.gd
      - src/actions/night_spell_action.gd
      - src/item.gd
      - assets/nightreign/data/expedition.json
      - assets/nightreign/data/weapon_archetypes.json
      - art/nightreign_weapon_icons.py
      - art/gen_items.py
      - assets/generated/item_sprites.json
      - assets/generated/item_sprites.png
      - assets/generated/item_sprites.tres
      - tests/weapon_archetypes.gd
      - tests/weapon_archetypes.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m1-weapon-qa.yml
  pull_request:
    branches: [main]
    paths:
      - src/nightreign/expedition/night_run.gd
      - src/actions/attack_move_action.gd
      - src/actions/melee_action.gd
      - src/actions/player_fire_action.gd
      - src/actions/night_spell_action.gd
      - src/item.gd
      - assets/nightreign/data/expedition.json
      - assets/nightreign/data/weapon_archetypes.json
      - art/nightreign_weapon_icons.py
      - art/gen_items.py
      - assets/generated/item_sprites.json
      - assets/generated/item_sprites.png
      - assets/generated/item_sprites.tres
      - tests/weapon_archetypes.gd
      - tests/weapon_archetypes.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - .github/workflows/m1-weapon-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weapon-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/m1-weapon-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m1-weapon-import.log

      - name: Run focused weapon contract
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/WEAPON_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/weapon_archetypes.tscn --quit-after 1800 2>&1 | tee /tmp/m1-weapon.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m1-weapon.log
          test -s docs/WEAPON_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/WEAPON_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          assert report.get('weapon_count') == 8, report.get('weapon_count')
          assert report.get('checks', 0) >= 145, report.get('checks')
          print('M1 weapon QA:', report['checks'], 'checks passed')
          PY

      - name: Run full expedition regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M1_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/expedition.tscn --quit-after 1800 2>&1 | tee /tmp/m1-expedition.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m1-expedition.log
          test -s docs/M1_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/M1_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          print('M1 expedition regression:', report.get('checks', 0), 'checks passed')
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-weapon-qa
          path: |
            docs/WEAPON_QA.json
            docs/M1_QA.json
            /tmp/m1-weapon-import.log
            /tmp/m1-weapon.log
            /tmp/m1-expedition.log
          if-no-files-found: ignore
