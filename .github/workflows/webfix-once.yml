name: Web Playability Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/webfix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Web playability repair in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Browser owns physical canvas/window sizing. Godot keeps only logical scaling.
          display = Path('src/nightreign/display/display_profiles.gd')
          display.write_text('''extends Node


enum Profile { DESKTOP_STANDARD, DESKTOP_PET, MOBILE_FUTURE }

const LOGICAL_SIZE := Vector2i(576, 324)

var current_profile: Profile = Profile.DESKTOP_STANDARD


func _ready() -> void:
\tapply_profile(
\t\tProfile.DESKTOP_PET
\t\tif "--pet" in OS.get_cmdline_user_args()
\t\telse Profile.DESKTOP_STANDARD
\t)
\t# A Web export's physical canvas belongs to the browser/export shell. Rewriting
\t# Window.size from Godot creates a resize feedback loop and an offset viewport.
\tif not OS.has_feature("web"):
\t\tget_window().size_changed.connect(_keep_aspect)


func apply_profile(profile: Profile) -> void:
\tcurrent_profile = profile
\tvar window := get_window()
\twindow.content_scale_size = LOGICAL_SIZE
\twindow.content_scale_mode = Window.CONTENT_SCALE_MODE_VIEWPORT
\twindow.content_scale_aspect = Window.CONTENT_SCALE_ASPECT_KEEP
\twindow.content_scale_factor = 1.0
\twindow.content_scale_stretch = Window.CONTENT_SCALE_STRETCH_INTEGER

\tif OS.has_feature("web"):
\t\treturn

\twindow.min_size = LOGICAL_SIZE
\twindow.unresizable = profile == Profile.DESKTOP_PET

\tif profile == Profile.DESKTOP_PET:
\t\twindow.size = LOGICAL_SIZE
\telif profile == Profile.DESKTOP_STANDARD:
\t\twindow.size = LOGICAL_SIZE * 2


func _keep_aspect() -> void:
\tif OS.has_feature("web") or current_profile != Profile.DESKTOP_STANDARD:
\t\treturn
\tvar window := get_window()
\tvar unit := maxi(36, roundi(window.size.x / 16.0))
\tvar target := Vector2i(unit * 16, unit * 9)
\tif window.size != target:
\t\twindow.size = target
''', encoding='utf-8')

          # 2. Permanent HUD button must not steal roguelike directional keyboard focus.
          hud = Path('scenes/ui/hud.tscn')
          text = hud.read_text(encoding='utf-8')
          needle = '[node name="InventoryButton" type="Button" parent="LeftPanel/VBoxContainer"]\nunique_name_in_owner = true\ncustom_minimum_size = Vector2(0, 30)\nlayout_mode = 2\ntext = "Inventory"'
          replacement = '[node name="InventoryButton" type="Button" parent="LeftPanel/VBoxContainer"]\nunique_name_in_owner = true\ncustom_minimum_size = Vector2(0, 30)\nlayout_mode = 2\nfocus_mode = 0\ntext = "Inventory"'
          assert needle in text, 'InventoryButton layout changed; refusing blind patch'
          hud.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          # 3. Vector2i.ZERO is a valid map coordinate; never use truthiness as "not found".
          attack = Path('src/actions/attack_move_action.gd')
          text = attack.read_text(encoding='utf-8')
          needle = '\tvar current_pos := map.find_monster_position(actor)\n\tif not current_pos:\n\t\treturn false'
          replacement = '\tvar current_pos := map.find_monster_position(actor)\n\tif current_pos == Utils.INVALID_POS:\n\t\treturn false'
          assert needle in text, 'AttackMoveAction position guard changed; refusing blind patch'
          attack.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          # 4. Gameplay input is event-driven and runs before GUI when no modal owns input.
          game = Path('scenes/game/game.gd')
          text = game.read_text(encoding='utf-8')
          assert 'func _unhandled_input(event: InputEvent) -> void:' in text
          text = text.replace('func _unhandled_input(event: InputEvent) -> void:', 'func _input(event: InputEvent) -> void:', 1)
          modal = '\tif Modals.has_visible_modals():\n'
          assert modal in text
          text = text.replace(modal, '\tif event is InputEventKey and event.echo:\n\t\treturn\n\n' + modal, 1)
          assert 'var action := await _check_player_input()' in text
          text = text.replace('var action := await _check_player_input()', 'var action := await _check_player_input(event)', 1)
          start = text.index('func _check_player_input() -> BaseAction:')
          end = text.index('\n\nfunc _handle_player_action(', start)
          region = text[start:end]
          region = region.replace('func _check_player_input() -> BaseAction:', 'func _check_player_input(event: InputEvent) -> BaseAction:', 1)
          region = region.replace('Input.is_action_just_pressed(', 'event.is_action_pressed(')
          text = text[:start] + region + text[end:]

          # Publish deterministic browser-observable state. This avoids OCR/screenshot guesses.
          init_needle = '\t# Update actors\n\t_update_actors()\n\n\nfunc _process'
          assert init_needle in text
          text = text.replace(init_needle, '\t# Update actors\n\t_update_actors()\n\t_publish_web_qa("ready")\n\n\nfunc _process', 1)

          handle_needle = '\t# Ready for next input\n\twaiting_for_player_input = true\n\n\nfunc _update_actors() -> void:'
          assert handle_needle in text
          telemetry = '''\t# Ready for next input
\twaiting_for_player_input = true
\t_publish_web_qa(action.get_script().resource_path.get_file() if action.get_script() else "action")


func _publish_web_qa(last_action: String = "") -> void:
\tif not OS.has_feature("web") or not World.current_map or not World.player:
\t\treturn
\tvar pos := World.current_map.find_monster_position(World.player)
\tvar walkable: Array[String] = []
\tvar dirs := {
\t\t"w": Vector2i.UP,
\t\t"d": Vector2i.RIGHT,
\t\t"s": Vector2i.DOWN,
\t\t"a": Vector2i.LEFT,
\t\t"q": Vector2i.UP + Vector2i.LEFT,
\t\t"e": Vector2i.UP + Vector2i.RIGHT,
\t\t"z": Vector2i.DOWN + Vector2i.LEFT,
\t\t"c": Vector2i.DOWN + Vector2i.RIGHT,
\t}
\tfor key: String in dirs:
\t\tvar target: Vector2i = pos + dirs[key]
\t\tif not World.current_map.is_in_bounds(target):
\t\t\tcontinue
\t\tvar cell := World.current_map.get_cell(target)
\t\tif cell.is_walkable() and World.current_map.get_monster(target) == null:
\t\t\twalkable.append(key)
\tvar payload := JSON.stringify({
\t\t"ready": true,
\t\t"turn": World.current_turn,
\t\t"floor": World.current_map.depth,
\t\t"x": pos.x,
\t\t"y": pos.y,
\t\t"waiting_for_input": waiting_for_player_input,
\t\t"last_action": last_action,
\t\t"walkable": walkable,
\t\t"player_actor_visible": get_tree().get_first_node_in_group("player") != null,
\t})
\tJavaScriptBridge.eval("window.__nightreignQA = %s;" % payload)


func _update_actors() -> void:'''
          text = text.replace(handle_needle, telemetry, 1)
          game.write_text(text, encoding='utf-8')
          PY

      - name: Static T0 quality gate
        run: python3 tools/validate_t0.py

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/import.log

      - name: Runtime T0 quality gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/t0_core.tscn --quit-after 1800 2>&1 | tee /tmp/runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/runtime.log
          python3 - <<'PY'
          import json
          r=json.load(open('docs/T0_QA.json', encoding='utf-8'))
          assert r.get('checks') == 246 and not r.get('failures'), r
          print('Native T0 runtime: 246/246')
          PY

      - name: Install Web export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          target="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$target"
          cp -R /tmp/godot-templates/templates/. "$target/"

      - name: Export repaired Web build
        shell: bash
        run: |
          set -o pipefail
          rm -rf site && mkdir -p site/game
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release "Web" site/game/index.html 2>&1 | tee /tmp/export.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/export.log
          test -s site/game/index.html
          test -n "$(find site/game -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find site/game -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Install real browsers
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium firefox

      - name: Prove real browser gameplay
        shell: bash
        run: |
          python3 -m http.server 4173 -d site >/tmp/http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          cat > /tmp/web-smoke.mjs <<'JS'
          import { chromium, firefox } from 'playwright';

          for (const [name, browserType] of [['chromium', chromium], ['firefox', firefox]]) {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
            const fatals = [];
            const requestFailures = [];
            page.on('console', msg => {
              const t = msg.text();
              if (msg.type() === 'error' && /SCRIPT ERROR|Parse Error|RuntimeError|WebAssembly.*failed|abort\(/i.test(t)) fatals.push(t);
            });
            page.on('pageerror', err => fatals.push(`PAGEERROR: ${err.message}`));
            page.on('requestfailed', req => requestFailures.push(`${req.url()} :: ${req.failure()?.errorText}`));

            await page.goto('http://127.0.0.1:4173/game/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            const canvas = page.locator('canvas');
            await canvas.waitFor({ state: 'visible', timeout: 30000 });
            await canvas.click({ position: { x: 100, y: 100 } });
            await page.waitForFunction(() => window.__nightreignQA?.ready === true, null, { timeout: 30000 });
            const box = await canvas.boundingBox();
            if (!box || box.width < 500 || box.height < 280) throw new Error(`${name}: bad canvas ${JSON.stringify(box)}`);

            const before = await page.evaluate(() => ({...window.__nightreignQA}));
            console.log(name, 'READY', before, 'canvas', box);
            if (!before.player_actor_visible) throw new Error(`${name}: player actor is not visible/instantiated`);
            if (!Array.isArray(before.walkable) || before.walkable.length === 0) throw new Error(`${name}: spawn has no immediately walkable neighbor: ${JSON.stringify(before)}`);

            await page.keyboard.press('x');
            await page.waitForFunction(t => window.__nightreignQA?.turn > t, before.turn, { timeout: 5000 });
            const afterWait = await page.evaluate(() => ({...window.__nightreignQA}));
            console.log(name, 'WAIT_OK', afterWait);

            let moved = false;
            let moveState = null;
            for (const key of afterWait.walkable) {
              const state = await page.evaluate(() => ({...window.__nightreignQA}));
              await page.keyboard.press(key);
              try {
                await page.waitForFunction(s => {
                  const q=window.__nightreignQA;
                  return q && (q.x !== s.x || q.y !== s.y);
                }, state, { timeout: 2500 });
                moveState = await page.evaluate(() => ({...window.__nightreignQA}));
                if (moveState.turn <= state.turn) throw new Error(`${name}: moved without turn increment`);
                moved = true;
                break;
              } catch (_) {}
            }
            console.log(name, 'MOVE_RESULT', moved, moveState || await page.evaluate(() => ({...window.__nightreignQA})));
            if (!moved) throw new Error(`${name}: no legal movement key changed player position`);
            if (fatals.length) throw new Error(`${name}: fatal console errors ${JSON.stringify(fatals)}`);
            if (requestFailures.some(x => /\.wasm|\.pck/i.test(x))) throw new Error(`${name}: asset network failure ${JSON.stringify(requestFailures)}`);
            await page.screenshot({ path: `/tmp/${name}-playable.png` });
            await browser.close();
          }
          console.log('WEB_PLAYABILITY_PASS');
          JS
          node /tmp/web-smoke.mjs

      - name: Commit only after native and browser proof
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          rm -rf node_modules site .godot
          git config user.name "nightreign-prototype-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nightreign/display/display_profiles.gd scenes/ui/hud.tscn src/actions/attack_move_action.gd scenes/game/game.gd docs/T0_QA.json docs/T0_STATIC_QA.json
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m "T0 Web: repair input focus, canvas sizing and movement guard"
          git push origin HEAD:main
