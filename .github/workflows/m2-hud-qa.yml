name: M2 HUD QA

on:
  push:
    branches: [main]
    paths:
      - src/nightreign/expedition/night_overlay.gd
      - src/nightreign/expedition/night_run.gd
      - src/nightreign/config/character_catalog.gd
      - src/item.gd
      - tests/night_overlay.gd
      - tests/night_overlay.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - docs/PRODUCTION_PLAN.md
      - .github/workflows/m2-hud-qa.yml
  pull_request:
    branches: [main]
    paths:
      - src/nightreign/expedition/night_overlay.gd
      - src/nightreign/expedition/night_run.gd
      - src/nightreign/config/character_catalog.gd
      - src/item.gd
      - tests/night_overlay.gd
      - tests/night_overlay.tscn
      - tests/expedition.gd
      - tests/expedition.tscn
      - docs/PRODUCTION_PLAN.md
      - .github/workflows/m2-hud-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Clean import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --import --path . --quit 2>&1 | tee /tmp/m2-hud-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-hud-import.log

      - name: Run combat HUD contract
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M2_HUD_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/night_overlay.tscn --quit-after 1800 2>&1 | tee /tmp/m2-hud.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-hud.log
          test -s docs/M2_HUD_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/M2_HUD_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          assert report.get('checks', 0) >= 17, report.get('checks')
          print('M2 HUD QA:', report['checks'], 'checks passed')
          PY

      - name: Run expedition regression
        shell: bash
        run: |
          set -o pipefail
          rm -f docs/M1_QA.json
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . res://tests/expedition.tscn --quit-after 1800 2>&1 | tee /tmp/m2-expedition.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" /tmp/m2-expedition.log
          test -s docs/M1_QA.json
          python3 - <<'PY'
          import json
          report = json.load(open('docs/M1_QA.json', encoding='utf-8'))
          assert report.get('failures') == [], report.get('failures')
          print('M2 HUD expedition regression:', report.get('checks', 0), 'checks passed')
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-hud-qa
          path: |
            docs/M2_HUD_QA.json
            docs/M1_QA.json
            /tmp/m2-hud-import.log
            /tmp/m2-hud.log
            /tmp/m2-expedition.log
          if-no-files-found: ignore
